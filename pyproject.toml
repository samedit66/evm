[project]
name = "evm"
version = "0.1.0"
description = "Eiffel project and dependency manager"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "click",
    "filelock",
    "httpx",
    "lxml",
    "tomlkit",
]

[project.scripts]
evm = "evm.cli:main"

[build-system]
requires = ["uv_build>=0.11.24,<0.12"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pre-commit",
    "pytest",
    "pytest-cov",
    "pytest-timeout",
    "ruff",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
    "--strict-config",
    "--strict-markers",
]
markers = [
    "integration: tests involving subprocesses and filesystem integration",
    "network: tests requiring external network access",
    "toolchain: tests requiring a real Eiffel toolchain",
]

[tool.ruff]
target-version = "py314"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "B",
    "E",
    "F",
    "I",
    "RUF",
    "SIM",
    "UP",
]

[tool.ruff.format]
quote-style = "double"

[tool.coverage.run]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
