[project]
name = "evm"
version = "0.1.1b1"
description = "Eiffel project and dependency manager"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = [
    "click",
    "filelock",
    "httpx",
    "lxml",
    "py7zr",
    "tomlkit",
]

[project.scripts]
evm = "evm.cli:main"

[build-system]
requires = ["uv_build>=0.11.24,<0.12"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pre-commit",
    "pytest",
    "pytest-cov",
    "pytest-timeout",
    "ruff",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
    "--strict-config",
    "--strict-markers",
]
markers = [
    "integration: tests involving subprocesses and filesystem integration",
    "gobo: tests requiring the Gobo Eiffel toolchain",
    "ise: tests requiring the ISE Eiffel toolchain",
    "network: tests requiring external network access",
    "toolchain: tests requiring a real Eiffel toolchain",
]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "B",
    "E",
    "F",
    "I",
    "RUF",
    "SIM",
    "UP",
]

[tool.ruff.format]
quote-style = "double"

[tool.coverage.report]
show_missing = true
skip_covered = true
